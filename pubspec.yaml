name: my_first_app
description: Smart Attendance System using Face Recognition & Geofencing
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # =====================
  # Firebase
  # =====================
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0

  # =====================
  # ML Kit (Face Detection)
  # =====================
  google_mlkit_face_detection: ^0.10.0
  google_mlkit_commons: ^0.7.0

  # =====================
  # Face Recognition (MobileFaceNet)
  # =====================
  tflite_flutter: ^0.12.1

  # =====================
  # Camera & Image Processing
  # =====================
  camera: ^0.11.0+2
  image: ^4.2.0
  path_provider: ^2.1.3

  # =====================
  # Location & Background Service
  # =====================
  geolocator: ^11.0.0
  flutter_background_service: ^5.1.0

  # =====================
  # Notifications & Permissions
  # =====================
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.0

  # =====================
  # Security & Auth
  # =====================
  local_auth: ^2.1.7

  # =====================
  # Utilities
  # =====================
  intl: ^0.19.0
  provider: ^6.1.2
  go_router: ^14.2.0
  csv: ^6.0.0
  http: ^1.2.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/Screenshot 2026-08-24 112218.png
    - assets/models/mobilefacenet.tflite

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/Screenshot 2026-08-24 112218.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/Screenshot 2026-08-24 112218.png
